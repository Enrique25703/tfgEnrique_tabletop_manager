spring.application.name=tfg-enrique
spring.config.import=optional:file:.env[.properties]
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Define TFG_DB_URL, TFG_DB_USERNAME y TFG_DB_PASSWORD en el entorno local.
spring.datasource.url=${TFG_DB_URL:jdbc:mysql://localhost:3306/tfgenrique?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${TFG_DB_USERNAME}
spring.datasource.password=${TFG_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.servlet.encoding.enabled=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# La estructura de la base de datos se mantiene mediante los scripts SQL versionados.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
